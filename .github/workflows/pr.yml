name: PR-CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

env:
  GO_VERSION: '1.27.3'
  GO_LINT_VERSION: v2.15.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Lint module
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GO_LINT_VERSION }}
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: make test
