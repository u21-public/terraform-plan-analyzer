version: "2"
linters:
  enable:
    - bodyclose
    - gocyclo
    - lll
    - misspell
    - revive
  settings:
    gocyclo:
      min-complexity: 25
    lll:
      line-length: 150
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
